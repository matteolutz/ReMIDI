; PlatformIO configuration for running examples

[env]
lib_deps =
    fortyseveneffects/MIDI Library@^5.0.2

; Environment for example project `tapedelay`
; This is a real project using an Arduino Pro Micro
[env:tapedelay]
platform = atmelavr
board = micro
framework = arduino
build_src_filter =
    +<*> +<../examples/tapedelay/>


; --------------------------- Testing environments --------------------------- ;
; Testing on real Arduino UNO
[env:test_avr_uno]
platform = atmelavr
board = uno
framework = arduino
test_build_src = true
test_filter =
    common/*
    avr/*

; Testing on Arduino UNO using `avrsim`
; Please run this test environment with `--without-uploading`
[env:test_avr_uno_sim]
platform = atmelavr
board = uno
framework = arduino
test_build_src = true
test_filter =
    common/*
    avr/*
platform_packages =
    platformio/tool-simavr
test_speed = 9600
test_testing_command =
    ${platformio.packages_dir}/tool-simavr/bin/simavr
    -m
    atmega328p
    -f
    16000000L
    ${platformio.build_dir}/${this.__env__}/firmware.elf

; Testing on native
[env:test_native]
platform = native
test_build_src = true
test_filter =
    common/*
    native/*